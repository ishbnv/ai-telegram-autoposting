name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste bot tokens, API keys or private chat IDs into this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an RSS source for …
        2. Run the pipeline
        3. The moderation card arrives without …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Admin panel (web)
        - API
        - Worker (sources, generation, publishing)
        - Telegram bot (moderation buttons)
        - Deployment / Docker
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens and keys before pasting.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
