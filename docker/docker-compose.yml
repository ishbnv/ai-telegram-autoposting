name: ai-telegram-autoposting

# One image, four services. `docker compose up -d postgres` on its own is still
# the development setup; the rest only come up when you ask for them.

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # Tokens, keys and the admin hash come from the repository-root .env.
  #
  # Compose expands `$NAME` inside these values before they reach the
  # container, so a literal `$` in a secret has to be written `$$` there. The
  # admin password hash used to be `$`-separated and arrived truncated, which
  # rejected every login with nothing to explain it; it is colon-separated now,
  # and the API refuses to start on a hash that does not match that shape.
  env_file: ../.env
  environment: &app-env
    # These override whatever .env says. Inside the network the database is a
    # hostname, not localhost, and a .env written for development would
    # otherwise put the containers in development mode.
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-autoposting}:${POSTGRES_PASSWORD:-autoposting}@postgres:5432/${POSTGRES_DB:-autoposting}?schema=public
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoposting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoposting}
      POSTGRES_DB: ${POSTGRES_DB:-autoposting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-autoposting} -d ${POSTGRES_DB:-autoposting}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. Everything else waits for it, so three processes cannot
  # race each other applying the same migration.
  migrate:
    <<: *app
    restart: "no"
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["pnpm", "--filter", "@workspace/api", "run", "start"]
    environment:
      <<: *app-env
      # Resolved from the api's working directory inside the image.
      WEB_DIST_DIR: ../web/dist
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@workspace/worker", "run", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *app
    command: ["pnpm", "--filter", "@workspace/bot", "run", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
